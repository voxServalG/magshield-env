schema_name: magshield_env.build_config
schema_version: 1
name: minimal-two-channel
region:
  kind: import
  path: points.csv
  frame: body
forward:
  kind: finite_element
  channel_files:
    - field_ch0.csv
    - field_ch1.csv
  channel_ids:
    - ch0
    - ch1
  coordinate_tolerance_m: 0.0
hardware:
  timestep_seconds: 0.01
  channels:
    - channel_id: ch0
      current_lower_a: -1.0
      current_upper_a: 1.0
      slew_rate_upper_a_per_s: 10.0
      resistance_ohm: 1.0
      voltage_upper_v: 10.0
    - channel_id: ch1
      current_lower_a: -1.0
      current_upper_a: 1.0
      slew_rate_upper_a_per_s: 10.0
      resistance_ohm: 1.0
      voltage_upper_v: 10.0
scenario:
  kind: static
  episode_length: 4
  external_field_component_frame: body
environment:
  observation_mode: full_field
  include_pose: false
  action_mode: current_delta
  constraint_mode: project_and_report
  reward:
    field_scale_t: 1.0e-6
    field_threshold_t: 1.0e-7
    field_weight: 1.0
    power_scale_w: 1.0
    power_weight: 0.01
    slew_scale_a: 0.1
    slew_weight: 0.01
    constraint_scale_a: 0.1
    constraint_weight: 1.0
output_dir: environment
