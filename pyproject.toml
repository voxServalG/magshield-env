[project]
name = "magshield-env"
version = "0.1.0"
description = "Build validated Gymnasium magnetic-control environments from physical system definitions."
readme = "README.md"
authors = [
    { name = "Vox Gu", email = "2020308160237@cau.edu.cn" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "gymnasium>=1.3.0",
    "h5py>=3.16.0",
    "meshio>=5.3.5",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

[project.scripts]
magshield-env = "magshield_env.cli:main"

[project.optional-dependencies]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-intl>=2.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
packages = ["src/magshield_env"]

[tool.hatch.build.targets.wheel.force-include]
schemas = "magshield_env/schemas"

[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/docs",
    "/examples",
    "/schemas",
    "/site",
    "/skills",
    "/src",
    "/tests",
    "/.gitattributes",
    "/.gitignore",
    "/.python-version",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["magshield_env"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*", "meshio", "meshio.*"]
ignore_missing_imports = true
