name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync --locked --all-extras
      - name: Compile English translations
        run: uv run sphinx-intl build --locale-dir site/locales
      - name: Build Chinese site
        run: uv run sphinx-build -b html site site/_build/html -W
      - name: Build English site
        env:
          READTHEDOCS_LANGUAGE: en
        run: uv run sphinx-build -b html site site/_build/html-en -W -D language=en
      - name: Check links
        run: uv run sphinx-build -b linkcheck site site/_build/linkcheck -W
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: site/_build/html
